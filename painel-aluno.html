<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>👩‍🎓 Painel do Aluno</title>
<link rel="stylesheet" href="style.css"/>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5; }
  header { background:#1976d2; color:white; padding:20px; text-align:center; }
  h1 { margin:0; font-size:1.8rem; }
  main { padding:20px; max-width:900px; margin:auto; }
  .info, .form-edicao, .historico-container { background:white; padding:15px; border-radius:10px; margin-bottom:15px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
  label { display:block; margin-top:10px; font-weight:bold; }
  input { width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:5px; }
  .btn { cursor:pointer; border:none; border-radius:5px; padding:8px 12px; transition:0.2s; margin-top:10px; }
  .btn:hover { opacity:0.85; }
  .btn-azul { background-color:#1976d2; color:white; }
  .btn-verde { background-color:#4CAF50; color:white; }
  .btn-verde-escuro { background:#2e7d32; color:white; }
  .btn-vermelho { background:#f44336; color:white; }
  .btn-vermelho-escuro { background:#c62828; color:white; }
  .historico-container { max-height:250px; overflow-y:auto; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:#f1f8ff; padding:8px; border-radius:5px; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center; }
  li.compra { background:#e8f5e9; }
</style>
<script type="module">
import { db } from "./firebase.js";
import { doc, getDoc, updateDoc, collection, query, where, getDocs, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let alunoId = localStorage.getItem("alunoSelecionado");
if(!alunoId) { alert("Aluno não selecionado."); window.location.href="professor.html"; }

let aluno = {};

const nomeInput = document.getElementById("nomeAluno");
const senhaInput = document.getElementById("senhaAluno");
const turmaInput = document.getElementById("turmaAluno");
const saldoInput = document.getElementById("saldoAluno");
const historicoLista = document.getElementById("historicoLista");

async function carregarAluno() {
  const snap = await getDoc(doc(db,"usuarios",alunoId));
  if(!snap.exists()) { alert("Aluno não encontrado"); window.location.href="professor.html"; }
  aluno = snap.data();
  document.getElementById("alunoInfo").innerHTML = `👋 ${aluno.nome} | 💰 Saldo: ${aluno.saldo || 0}`;
  nomeInput.value = aluno.nome || "";
  senhaInput.value = aluno.senha || "";
  turmaInput.value = aluno.turma || "";
  saldoInput.value = aluno.saldo || 0;
}

window.salvarAlteracoes = async function() {
  if(!confirm("Confirma as alterações deste aluno?")) return;

  await updateDoc(doc(db,"usuarios",alunoId),{
    nome: nomeInput.value,
    senha: senhaInput.value,
    turma: turmaInput.value,
    saldo: Number(saldoInput.value)
  });
  alert("Alterações salvas com sucesso!");
  carregarAluno();
};

window.mostrarHistorico = async function() {
  historicoLista.innerHTML = "";
const q = query(collection(db,"historico"), where("alunoId","==",alunoId));
const snap = await getDocs(q);

if(snap.empty) {
  historicoLista.innerHTML = "<li>Nenhum registro encontrado.</li>";
  return;
}

snap.forEach(docSnap => {
  const h = docSnap.data();
  const produtos = h.produtos.map(p => `${p.nome} x${p.qtd} - 💲${p.preco}`).join(", ");
  historicoLista.innerHTML += `
    <li>${new Date(h.data).toLocaleString()} - ${produtos}</li>
  `;
});

    historicoLista.innerHTML = "<li>Nenhum registro encontrado.</li>";
    return;
  }

  snap.forEach(docSnap => {
    const h = docSnap.data();
    const classe = h.produto ? "compra" : "";
    
    // Exibir quantidade corretamente
    const qtd = h.qtd || 1; // caso não exista, assume 1

  });
};


window.limparHistorico = async function() {
  if(!confirm("Tem certeza que deseja limpar todo o histórico deste aluno?")) return;
  const q = query(collection(db,"historico"), where("alunoId","==",alunoId));
  const snap = await getDocs(q);
  snap.forEach(async docSnap => {
    await deleteDoc(doc(db,"historico",docSnap.id));
  });
  alert("Histórico limpo com sucesso!");
  historicoLista.innerHTML = "";
};

window.excluirAluno = async function() {
  const professorId = localStorage.getItem("usuarioId"); // professor logado
  const senha = prompt("Digite sua senha de professor para confirmar:");
  if(!senha) return;

  const professorSnap = await getDoc(doc(db, "usuarios", professorId));
  if(!professorSnap.exists() || professorSnap.data().tipo !== "professor") {
    alert("Erro: professor não encontrado.");
    return;
  }

  if(professorSnap.data().senha !== senha) {
    alert("Senha incorreta. Operação cancelada.");
    return;
  }

  if(!confirm("Tem certeza que deseja excluir este aluno permanentemente?")) return;

  await deleteDoc(doc(db,"usuarios",alunoId));
  alert("Aluno excluído com sucesso!");
  window.location.href="professor.html";
};

window.voltar = function() { window.location.href="professor.html"; };

carregarAluno();
</script>
</head>
<body>
<header>
  <h1>👩‍🎓 Painel do Aluno</h1>
</header>
<main>
  <div class="info" id="alunoInfo"></div>

  <div class="form-edicao">
    <label>Nome:</label>
    <input type="text" id="nomeAluno">
    <label>Senha:</label>
    <input type="text" id="senhaAluno">
    <label>Turma:</label>
    <input type="text" id="turmaAluno">
    <label>Saldo:</label>
    <input type="number" id="saldoAluno">

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
      <button class="btn btn-verde" onclick="salvarAlteracoes()">💾 Salvar Alterações</button>
      <button class="btn btn-azul" onclick="mostrarHistorico()">📜 Ver Histórico</button>
      <button class="btn btn-vermelho-escuro" onclick="limparHistorico()">🗑️ Limpar Histórico</button>
      <button class="btn btn-vermelho" onclick="excluirAluno()">❌ Excluir Aluno</button>
      <button class="btn btn-azul" onclick="voltar()">⬅️ Voltar</button>
    </div>
  </div>

  <div class="historico-container">
    <ul class="historico" id="historicoLista"></ul>
  </div>
</main>
</body>
</html>
