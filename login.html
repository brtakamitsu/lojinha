<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🔐 Login Escola</title>
<link rel="stylesheet" href="style.css"/>
<style>
  body {
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    background:#e3f2fd;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    min-height:100vh;
  }
  .login-card {
    background:white;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    padding:30px 25px;
    max-width:400px;
    width:90%;
    text-align:center;
  }
  .login-card img {
    max-width:120px;
    max-height:120px;
    margin-bottom:15px;
  }
  .login-card h2 {
    margin:10px 0 20px;
    color:#1976d2;
  }
  .login-card input {
    width:70%;
    padding:10px;
    margin:5px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:1rem;
  }
  .login-card button {
    padding:10px 20px;
    margin-left:10px;
    border:none;
    border-radius:8px;
    background:#1976d2;
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.2s;
  }
  .login-card button:hover {
    opacity:0.85;
  }
  .voltar-btn {
    margin-top:15px;
    background:#4CAF50;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
  }
  .voltar-btn:hover {
    opacity:0.85;
  }
  .login-fields {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
  }
</style>
<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

document.addEventListener("DOMContentLoaded", async () => {
  const logoImg = document.getElementById("logoEscola");
  const escolaId = localStorage.getItem("escolaId");
  const escolaLogo = localStorage.getItem("escolaLogo");
  if (!escolaId || !escolaLogo) {
    alert("Nenhuma escola selecionada!");
    window.location.href = "index.html";
    return;
  }
  logoImg.src = escolaLogo;

  const loginForm = document.getElementById("loginForm");
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nome = document.getElementById("nome").value.trim();
    const senha = document.getElementById("senha").value.trim();

    const usuariosSnap = await getDocs(collection(db, "usuarios"));
    let usuarioEncontrado = null;

    usuariosSnap.forEach(docSnap => {
      const user = docSnap.data();
      if (user.nome.toLowerCase() === nome.toLowerCase() && user.escolaId === escolaId) {
        usuarioEncontrado = { id: docSnap.id, ...user };
      }
    });

    if (!usuarioEncontrado) {
      alert("❌ Usuário não encontrado!");
      return;
    }

    if (usuarioEncontrado.senha !== senha) {
      alert("❌ Senha incorreta!");
      return;
    }

    localStorage.setItem("usuarioId", usuarioEncontrado.id);

    if (usuarioEncontrado.tipo === "professor") {
      window.location.href = "professor.html";
    } else {
      window.location.href = "aluno.html";
    }
  });

  document.getElementById("voltarEscolas").addEventListener("click", () => {
    window.location.href = "index.html";
  });
});
</script>
</head>
<body>
  <div class="login-card">
    <img id="logoEscola" src="" alt="Logo da Escola">
    <h2>Login</h2>
    <form id="loginForm" class="login-fields">
      <input type="text" id="nome" placeholder="Nome" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit">Acessar ➡️</button>
    </form>
    <button class="voltar-btn" id="voltarEscolas">⬅️ Seleção de Escola</button>
  </div>
</body>
</html>
